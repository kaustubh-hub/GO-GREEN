<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Go Green</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"> <!-- Premium Google Fonts -->

<style>
 * {
 margin: 0;
 padding: 0;
 box-sizing: border-box;
 font-family: 'Roboto', sans-serif; /* Modern, clean font */
 }

 body {
 overflow-x: hidden;
 background: #000;
 color: #fff;
 height: 100vh;
 display: flex;
 justify-content: center;
 align-items: center;
 }

 .bg-video {
 position: fixed;
 top: 0;
 left: 0;
 width: 100%;
 height: 100%;
 object-fit: cover;
 z-index: -3;
 }

 /* Background image - Enhanced for premium feel */
 .bg-image {
 position: fixed;
 top: 0;
 left: 0;
 width: 100%;
 height: 100%;
 background: url('bg.jpg') no-repeat center center fixed;
 background-size: cover;
 filter: brightness(0.8) contrast(1.1); /* Subtle enhancement */
 z-index: -3;
 }

 /* Fallback for low-end devices or small screens */
 @media (max-width: 768px) or (prefers-reduced-motion: reduce) {
 .bg-image {
 background-attachment: scroll;
 }
 }

 /* Gradient overlay - More sophisticated */
 .overlay {
 position: fixed;
 top: 0;
 left: 0;
 width: 100%;
 height: 100%;
 background: linear-gradient(135deg, rgba(0,0,0,0.7), rgba(0,0,0,0.5), rgba(0,0,0,0.8));
 z-index: -2;
 }

 /* SIGN-UP FORM - Premium glassmorphism design */
 .signup-container {
 width: 400px;
 padding: 40px;
 background: rgba(255, 255, 255, 0.1);
 backdrop-filter: blur(15px);
 border-radius: 25px;
 box-shadow: 0 10px 30px rgba(0,0,0,0.4);
 border: 1px solid rgba(255, 255, 255, 0.1);
 text-align: center;
 animation: fadeIn 1s ease;
 }

 @keyframes fadeIn {
 from { opacity: 0; transform: scale(0.9); }
 to { opacity: 1; transform: scale(1); }
 }

 .signup-container h1 {
 font-family: 'Playfair Display', serif;
 font-size: 2.5rem;
 color: #ffcc00;
 margin-bottom: 20px;
 text-shadow: 0 2px 10px rgba(0,0,0,0.5);
 }

 .signup-container input {
 width: 100%;
 padding: 15px;
 margin-bottom: 20px;
 border: 1px solid rgba(255, 255, 255, 0.3);
 border-radius: 15px;
 background: rgba(255, 255, 255, 0.1);
 color: #fff;
 font-size: 1rem;
 transition: all 0.3s ease;
 }

 .signup-container input::placeholder {
 color: #ccc;
 }

 .signup-container input:focus {
 border-color: #ffcc00;
 box-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
 outline: none;
 }

 .signup-container button {
 width: 100%;
 padding: 15px;
 background: linear-gradient(135deg, #ffb400, #ff7f00);
 color: white;
 border: none;
 border-radius: 15px;
 font-size: 1.2rem;
 font-weight: 600;
 cursor: pointer;
 transition: all 0.3s ease;
 margin-bottom: 15px;
 }

 .signup-container button:hover {
 transform: scale(1.05);
 box-shadow: 0 5px 15px rgba(255,140,0,0.6);
 }

 .signup-container a {
 color: #ffcc00;
 text-decoration: none;
 font-size: 1rem;
 transition: color 0.3s ease;
 }

 .signup-container a:hover {
 color: #ffb400;
 text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
 }

 /* Responsive Enhancements */
 @media (max-width: 768px) {
 .signup-container {
 width: 300px;
 padding: 30px;
 }
 .signup-container h1 {
 font-size: 2rem;
 }
 }


 /* Inline status message */
 .form-message {
 display: none;
 margin-bottom: 15px;
 padding: 12px 14px;
 border-radius: 12px;
 font-size: 0.95rem;
 line-height: 1.4;
 text-align: left;
 }
 .form-message.error { display: block; background: rgba(255, 80, 80, 0.2); border: 1px solid rgba(255, 120, 120, 0.6); color: #ffd6d6; }
 .form-message.info { display: block; background: rgba(255, 204, 0, 0.15); border: 1px solid rgba(255, 204, 0, 0.6); color: #fff3c4; }
 .form-message.success { display: block; background: rgba(80, 200, 120, 0.2); border: 1px solid rgba(120, 220, 150, 0.6); color: #d6ffe3; }
 .form-message a { font-weight: 700; text-decoration: underline; }

</style>
</head>
<body>
<video autoplay muted loop playsinline class="bg-video">
 <source src="MICRO bg.mp4" type="video/mp4">
</video>

<!-- Background Image -->
<div class="overlay"></div>

<div class="signup-container">
 <h1>Sign Up for Go Green</h1>
 <form id="signupForm">
  <input type="text" id="username" placeholder="Username" required>
  <input type="email" id="email" placeholder="Email" required>
  <input type="password" id="password" placeholder="Password" required>
  <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
  <button type="submit">Sign Up</button>
 </form>
 <div id="formMessage" class="form-message"></div>
 <a href="login.html">Already have an account? Login</a>
</div>

<script>
function showMessage(type, text) {
 const box = document.getElementById('formMessage');
 box.className = 'form-message ' + type;
 box.textContent = text;
}

/* Handle sign-up form submission (no data is stored anywhere) */
document.getElementById('signupForm').addEventListener('submit', function(event) {
 event.preventDefault();

 const username = document.getElementById('username').value.trim();
 const email = document.getElementById('email').value.trim();
 const password = document.getElementById('password').value;
 const confirmPassword = document.getElementById('confirmPassword').value;

 if (username === '' || email === '' || password === '' || confirmPassword === '') {
  showMessage('error', 'Please fill in all fields.');
  return;
 }
 if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
  showMessage('error', 'Please enter a valid email address.');
  return;
 }
 if (password.length < 6) {
  showMessage('error', 'Password must be at least 6 characters long.');
  return;
 }
 if (password !== confirmPassword) {
  showMessage('error', 'Passwords do not match.');
  return;
 }

 showMessage('success', 'Sign-up successful! Redirecting to the login page...');
 window.location.href = 'login.html';
});
</script>

</body>
</html>
